services:
  npm:
    image: jc21/nginx-proxy-manager:latest
    container_name: nginx-proxy-manager
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
      - "81:81"
    volumes:
      - npm_data:/data
      - npm_letsencrypt:/etc/letsencrypt
    networks:
      - db-net
      - proxy

volumes:
  npm_data:
  npm_letsencrypt:

networks:
  db-net:
    external: true
  proxy:
    external: true