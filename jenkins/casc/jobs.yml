jobs:
  - script: |
      def envs = ['dev', 'staging', 'prod']
      def rootConfigs = ['bootstrap', 'iam', 'api', 'dynamodb-auth']

      envs.each { e ->
        def folderName    = "terraform-" + e
        def folderDisplay = "Terraform — " + e.toUpperCase()

        folder(folderName) {
          displayName(folderDisplay)
          description("Pipelines Terraform in " + e)
        }

        rootConfigs.each { r ->
          def jobName    = folderName + "/" + r
          def jobDisplay = r + " (" + e + ")"

          pipelineJob(jobName) {
            displayName(jobDisplay)
            description("Pipeline " + r + " in " + e)

            parameters {
              choiceParam('ACTION', ['plan', 'apply', 'destroy'], 'Ação')
              booleanParam('RUN_TESTS', true, 'Run terraform test')
            }

            definition {
              cpsScm {
                scm {
                  git {
                    remote {
                      url('git@github.com:yagohp/portfolio-infra.git')
                      credentials('github-ssh-key') 
                    }
                    branch('*/main')
                  }
                }
                scriptPath('jenkins/jobs/repo.Jenkinsfile')
                lightweight(true)
              }
            }
          }
        }
      }

      // ═══════════════════════════════════════════════════════════
      //  PORTFOLIO API — .NET
      // ═══════════════════════════════════════════════════════════

      folder('portfolio-api') {
          displayName('Portfolio API')
          description('Pipelines portfolio-dotnet-api')
      }

      pipelineJob('portfolio-api/integration-tests') {
          displayName('Integration Tests')
          description('Run integration tests for portfolio-dotnet-api.')

          logRotator {
              numToKeep(30)
              artifactNumToKeep(10)
          }

          configure { project ->
            project / 'triggers' / 'org.jenkinsci.plugins.gwt.GenericTrigger' {
                spec('')
                token(System.getenv('JENKINS_WEBHOOK_TOKEN') ?: 'portfolio-e2e-2026')
                causeString('GitHub Actions')
                printContributedVariables(true)
                printPostContent(true)
                silentResponse(false)

                genericVariables {
                    [
                        ['REPO',         '$.repository'],
                        ['GIT_SHA',      '$.sha'],
                        ['GIT_REF_NAME', '$.ref_name'],
                        ['RUN_URL',      '$.run_url'],
                        ['VERSION',      '$.version']
                    ].each { name, path ->
                        'org.jenkinsci.plugins.gwt.GenericVariable' {
                            key(name)
                            value(path)
                            expressionType('JSONPath')
                        }
                    }
                }
            }
          }

          parameters {
              stringParam('REPO_OVERRIDE', '', 'Override repo')
              stringParam('REF_OVERRIDE', '', 'Override ref/sha')
          }

          definition {
              cpsScm {
                  scm {
                      git {
                          remote {
                              url('git@github.com:yagohp/portfolio-dotnet-api.git')
                              credentials('github-ssh-key')
                          }
                          branch('*/main')
                      }
                  }
                  scriptPath('Jenkinsfile.integration')
                  lightweight(true)
              }
          }
      }