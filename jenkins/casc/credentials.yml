credentials:
  system:
    domainCredentials:
      - credentials:
          # ── GitHub ────────────────────────────────────────────────
          - basicSSHUserPrivateKey:
              scope: GLOBAL
              id: "github-ssh-key"
              username: "git"
              description: "GitHub SSH Key for repo cloning"
              privateKeySource:
                directEntry:
                  privateKey: "${GITHUB_SSH_KEY}"

          # ── Webhook ───────────────────────────────────────────────
          - string:
              scope: GLOBAL
              id: "jenkins-webhook-token"
              description: "Token compartilhado com o GitHub Actions"
              secret: "${JENKINS_WEBHOOK_TOKEN}"

          # ── Banco de Dados ────────────────────────────────────────
          - string:
              scope: GLOBAL
              id: "postgres-password"
              description: "PostgreSQL password"
              secret: "${DB_POSTGRES_PASSWORD}"