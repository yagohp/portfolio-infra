jenkins:
  systemMessage: |
    Portfolio — Jenkins

  numExecutors: 4
  mode: NORMAL

  views:
    - list:
        name: "Terraform"
        description: "Pipelines to run Terraform scripts"
        includeRegex: "Terraform — (DEV|STAGING|PROD)|terraform-.*"
        columns:
          - "status"
          - "weather"
          - "jobName"
          - "lastSuccess"
          - "lastFailure"
          - "lastDuration"
    - list:
        name: ".NET API"
        description: "Pipelines for testing and deployment of the .NET API"
        includeRegex: "portfolio-.*"
        columns:
          - "status"
          - "weather"
          - "jobName"
          - "lastSuccess"
          - "lastFailure"
          - "lastDuration"
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "admin"
          password: "${JENKINS_ADMIN_PASSWORD}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

tool:
  git:
    installations:
      - name: "Default"
        home: "/usr/bin/git"

unclassified:
  location:
    url: "${JENKINS_URL}"
    adminAddress: "admin@portfolio.local"



      
